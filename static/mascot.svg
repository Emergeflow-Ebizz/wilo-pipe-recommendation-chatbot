<svg viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg">
  <!-- Main water droplet body -->
  <path d="M100 20 C140 60 160 120 160 160 C160 220 130 260 100 260 C70 260 40 220 40 160 C40 120 60 60 100 20 Z" fill="#5B9FBD" stroke="#4A7A96" stroke-width="2"/>

  <!-- Highlight on top -->
  <ellipse cx="80" cy="50" rx="20" ry="15" fill="#A8D8FF" opacity="0.7"/>

  <!-- Shine effect -->
  <ellipse cx="75" cy="45" rx="8" ry="6" fill="white" opacity="0.6"/>

  <!-- Left eye white -->
  <ellipse cx="70" cy="130" rx="18" ry="22" fill="white"/>

  <!-- Right eye white -->
  <ellipse cx="130" cy="130" rx="18" ry="22" fill="white"/>

  <!-- Left iris -->
  <circle cx="72" cy="138" r="11" fill="#2B7A9B"/>

  <!-- Right iris -->
  <circle cx="128" cy="138" r="11" fill="#2B7A9B"/>

  <!-- Left pupil -->
  <circle cx="74" cy="135" r="6" fill="black"/>

  <!-- Right pupil -->
  <circle cx="126" cy="135" r="6" fill="black"/>

  <!-- Left eye shine -->
  <circle cx="76" cy="132" r="2" fill="white"/>

  <!-- Right eye shine -->
  <circle cx="124" cy="132" r="2" fill="white"/>

  <!-- Closed eyes curve at top -->
  <path d="M55 110 Q70 105 85 110" stroke="#4A7A96" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M115 110 Q130 105 145 110" stroke="#4A7A96" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Mouth -->
  <path d="M65 190 Q100 220 135 190" stroke="#2B7A9B" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Mouth fill inside -->
  <ellipse cx="100" cy="200" rx="35" ry="15" fill="#A8D8FF" opacity="0.3"/>
</svg>
