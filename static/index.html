<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wilo Pumps Selection Chatbot</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app-shell">
      <div class="phone">
        <div class="header">
          <div class="avatar">
            <svg viewBox="0 0 715.74799 310.39372" width="26" height="12" aria-hidden="true">
              <g transform="matrix(8.3333788,0,0,8.3333788,-2189.977,-3152.3462)">
                <path
                  d="m 346.69,391.693 c -1.267,-1.696 -3.619,-3.193 -7.459,-3.193 -3.84,0 -6.724,1.497 -8.648,3.193 -2.819,2.445 -3.99,5.389 -4.9,10.079 -0.922,4.738 -0.896,7.683 0.975,10.127 1.266,1.696 3.567,3.193 7.407,3.193 3.84,0 6.773,-1.497 8.7,-3.193 2.818,-2.444 3.988,-5.389 4.909,-10.127 0.911,-4.69 0.886,-7.634 -0.984,-10.079 l 0,0 0,0 z m -5.499,10.078 c -0.523,2.693 -1.119,4.988 -2.728,6.336 -0.894,0.748 -1.969,1.146 -3.265,1.146 -1.297,0 -2.167,-0.398 -2.77,-1.146 -1.085,-1.348 -0.788,-3.643 -0.265,-6.336 0.523,-2.695 1.109,-4.939 2.717,-6.287 0.895,-0.748 1.919,-1.147 3.215,-1.147 1.297,0 2.217,0.399 2.819,1.147 1.087,1.348 0.801,3.592 0.277,6.287 l 0,0 0,0 z m -23.024,5.189 5.38,-27.689 h -6.483 l -5.457,28.089 c -0.718,3.691 0.799,7.434 6.136,7.434 h 3.69 l 1.066,-5.488 h -2.494 c -1.646,-10e-4 -2.139,-0.8 -1.838,-2.346 l 0,0 0,0 z m -25.006,-18.161 -6.491,16.064 -2.215,-16.064 h -5.069 l -8.407,16.064 -1.068,-16.064 h -6.69 l 2.737,25.994 h 5.668 l 8.605,-16.314 2.266,16.314 h 5.668 l 9.333,-20.511 2.017,-10e-4 c 1.646,-0.007 2.142,0.789 1.849,2.336 l -3.494,18.192 h 6.482 l 3.57,-18.62 c 0.701,-3.695 -0.832,-7.43 -6.168,-7.406 l -8.593,0.016 0,0 z"
                  fill="#009c82"
                />
                <path
                  d="m 306.179,386.583 c 2.172,0 3.934,-1.762 3.934,-3.935 0,-2.172 -1.762,-3.934 -3.934,-3.934 -2.171,0 -3.932,1.761 -3.932,3.934 0,2.173 1.761,3.935 3.932,3.935 l 0,0 0,0 z"
                  fill="#009c82"
                />
              </g>
            </svg>
          </div>
          <div>
            <h1>Wilo Pumps Selection Chatbot</h1>
            <div class="status"><span class="dot"></span>Online</div>
          </div>
          <div class="menu-wrap">
            <button type="button" class="menu-btn" id="menu-btn" aria-label="Menu" aria-haspopup="true" aria-expanded="false">&#9776;</button>
            <div class="menu-dropdown" id="menu-dropdown" hidden>
              <button type="button" class="menu-item" id="menu-restart">🔄 Restart</button>
              <button type="button" class="menu-item" id="menu-continue">✅ Continue</button>
            </div>
          </div>
        </div>

        <div class="thread" id="thread"></div>

        <div class="composer">
          <input id="composer-input" type="text" placeholder="Choose an option above" disabled />
          <button type="button" class="send-btn" id="send-btn" aria-label="Send" disabled>&#10148;</button>
        </div>
        <div class="input-error" id="input-error" hidden></div>

        <div class="modal-backdrop" id="details-backdrop" hidden>
          <div class="modal-panel">
            <div class="modal-header">
              <button type="button" class="modal-back" id="details-close" aria-label="Back">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                  <path
                    d="M15 18l-6-6 6-6"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
                Back
              </button>
              <div class="modal-title">Pump Details</div>
              <button type="button" class="modal-fav" id="details-fav" aria-label="Save pump" aria-pressed="false">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                  <path
                    d="M12 20.5s-7.5-4.7-10-9.4C.4 7.6 2.2 4 5.7 4c2 0 3.6 1.1 4.3 2.7C10.7 5.1 12.3 4 14.3 4c3.5 0 5.3 3.6 3.7 7.1-2.5 4.7-10 9.4-10 9.4z"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>
            </div>
            <div class="modal-body" id="details-body"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
